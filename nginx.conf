server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers. NOTE: nginx drops server-level add_header directives in any
  # location that defines its own, so the locations below use `expires` instead
  # of add_header to keep these inherited.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # The service worker and manifest must always be revalidated.
  location = /sw.js {
    expires -1;
  }
  location = /manifest.json {
    expires -1;
  }

  # Hashed build output never changes, so cache it for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
