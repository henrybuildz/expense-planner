<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocket Book</title>
    <meta name="description" content="Pocket Book: an offline-first personal finance app for transactions, budgets, subscriptions and income/expense projections." />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket Book" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Launch splash: pure HTML/CSS so it paints instantly (before any JavaScript loads). -->
    <style>
      html.no-splash #splash { display: none; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #059669;
        isolation: isolate;
        will-change: transform;
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* the curtain lifts away at 1.65s, revealing the app that has been loading underneath */
        animation: splash-exit 0.6s cubic-bezier(0.7, 0, 0.3, 1) 1.65s forwards;
      }
      /* soft glow behind the logo (a separate layer so the bottom edge stays the plain brand green) */
      #splash::before {
        content: ''; position: absolute; inset: 0; z-index: -1;
        background: radial-gradient(ellipse closest-side at 50% 42%, rgba(52, 211, 153, 0.6) 0%, rgba(16, 185, 129, 0.28) 55%, rgba(5, 150, 105, 0) 100%);
      }
      /* the curved lower edge of the curtain: sits just below the screen, so it is invisible until the lift */
      #splash::after {
        content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 9vh;
        background: #059669; border-radius: 0 0 50% 50% / 0 0 100% 100%;
      }
      /* tap / key press: skip straight to the exit */
      #splash.splash-skip { animation-delay: 0s; animation-duration: 0.35s; }
      .splash-bars {
        display: flex; align-items: flex-end; gap: 19px; height: 120px;
        animation: splash-pop 0.5s ease-out 1.05s;
      }
      .splash-bars i {
        display: block; width: 32px; background: #fff; border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        transform-origin: bottom center; transform: scaleY(0);
        /* the >1 control point makes each bar overshoot slightly and settle: the "pop" */
        animation: splash-bar 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .splash-bars i:nth-child(1) { height: 46px;  animation-delay: 0.2s; }
      .splash-bars i:nth-child(2) { height: 82px;  animation-delay: 0.38s; }
      .splash-bars i:nth-child(3) { height: 120px; animation-delay: 0.56s; }
      .splash-title {
        font-size: 30px; font-weight: 650; letter-spacing: 0.01em;
        opacity: 0; transform: translateY(14px);
        animation: splash-title 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
      }
      /* bigger logo on desktop-sized screens */
      @media (min-width: 900px) {
        .splash-bars { height: 168px; gap: 26px; }
        .splash-bars i { width: 45px; border-radius: 8px; }
        .splash-bars i:nth-child(1) { height: 64px; }
        .splash-bars i:nth-child(2) { height: 115px; }
        .splash-bars i:nth-child(3) { height: 168px; }
        .splash-title { font-size: 38px; }
        #splash { gap: 36px; }
      }
      @keyframes splash-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes splash-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes splash-title { to { opacity: 1; transform: none; } }
      /* lifts off the top (transform only: no repaint per frame). It ends hidden and non-interactive even if JavaScript fails. */
      @keyframes splash-exit {
        to { transform: translateY(calc(-100% - 9vh)); visibility: hidden; }
      }
      @keyframes splash-fade { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash { animation: splash-fade 0.3s ease 0.9s forwards; }
        .splash-bars, .splash-bars i { animation: none; }
        .splash-bars i { transform: none; }
        .splash-title { animation: none; opacity: 1; transform: none; }
      }
    </style>
    <script src="./splash.js"></script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-bars"><i></i><i></i><i></i></div>
      <div class="splash-title">Pocket Book</div>
    </div>
    <div id="root"></div>
    <noscript>This app needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
